version: "3.8"

services:
  emqx:
    image: emqx/emqx:5.8.0
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT
      - "8083:8083" # MQTT/WebSocket
      - "8084:8084" # MQTT/WebSocket/SSL
      - "8883:8883" # MQTT/SSL
      - "18083:18083" # Dashboard + REST API
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - emqx-etc:/opt/emqx/etc
    environment:
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=your-strong-password-here
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  emqx-data:
  emqx-log:
  emqx-etc:
