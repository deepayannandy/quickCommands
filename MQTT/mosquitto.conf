# Mosquitto broker configuration.
# Note: Mosquitto only allows comments on their own line, never after a value.

# --- Persistence: keeps retained messages and sessions across restarts ---
persistence true
persistence_location /mosquitto/data/

# --- Logging: to a file (rotated by log-cleaner) and to Docker logs ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Authentication: applies to every listener below ---
allow_anonymous false
password_file /mosquitto/auth/passwd

# --- MQTT ---
listener 1883
protocol mqtt

# --- MQTT over WebSockets (browsers) ---
listener 9001
protocol websockets
