# Reverse proxy for a Node.js (Express, NestJS, etc.) app.
# Replace <your_domain> and <port>, then follow the README.
#
# Needs websocket-upgrade.conf in /etc/nginx/conf.d/ (it defines $connection_upgrade).

server {
    listen 80;
    listen [::]:80;

    server_name <your_domain>;

    # Max request body size. Raise it if your API accepts large file uploads.
    client_max_body_size 100M;

    location / {
        # Use 127.0.0.1, not localhost: localhost can resolve to IPv6 (::1)
        # while Node listens on IPv4 only, which gives a 502 Bad Gateway.
        proxy_pass http://127.0.0.1:<port>;
        proxy_http_version 1.1;

        # WebSocket / Socket.IO support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Pass the real client details to the app
        # (in Express, also set: app.set('trust proxy', 1))
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-running requests and idle WebSocket connections
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
