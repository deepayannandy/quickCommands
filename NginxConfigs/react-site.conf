# Static hosting for a React / Vite / any single-page app build.
# Replace <folder_name> and the domains, then follow the README.

server {
    listen 80;
    listen [::]:80;

    server_name <domain1> <domain2>;

    root /var/www/<folder_name>;
    index index.html;

    # Compress text assets (nginx's default only compresses text/html)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Client-side routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html, so users get new builds right away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built JS/CSS files have a hash in their name, so they can be cached for long
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Block hidden files like .env or .git if they end up in the folder
    # (.well-known stays reachable for Certbot / Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
