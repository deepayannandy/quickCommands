# Shared helper for proxied apps. Copy to /etc/nginx/conf.d/websocket-upgrade.conf
# once per server (defining it in each site file would cause a "duplicate" error).
#
# Sends "Connection: upgrade" only for WebSocket requests, and keeps normal
# HTTP requests as regular keep-alive connections.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
